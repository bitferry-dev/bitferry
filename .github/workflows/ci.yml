name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-latest
          - target: macos-aarch64
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux Xvfb and JavaFX system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libgl1 libglx-mesa0 libxxf86vm1 libxtst6 libfuse2t64 desktop-file-utils \
          || sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libgl1 libxxf86vm1 libxtst6 libfuse2 desktop-file-utils

      - name: Install WiX CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version "7.*"

      - name: Fetch pinned rclone and restic
        run: ./gradlew --no-daemon :bitferry-app:fetchTools

      - name: Add fetched engines to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/bitferry-app/build/image/bitferry-${{ matrix.target }}/bin" >> "$GITHUB_PATH"

      - name: Add fetched engines to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\bitferry-app\build\image\bitferry-${{ matrix.target }}\bin"

      - name: Verify fetched tools
        run: |
          rclone version
          restic version

      - name: Run checks and build distribution (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run -a ./gradlew --no-daemon check :bitferry-app:dist

      - name: Run checks and build distribution (Windows/macOS)
        if: runner.os != 'Linux'
        run: ./gradlew --no-daemon check :bitferry-app:dist

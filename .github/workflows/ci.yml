name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-latest
          - target: macos-aarch64
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Azul Zulu JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux Xvfb and JavaFX system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libgl1 libglx-mesa0 libxxf86vm1 libxtst6 libfuse2t64 desktop-file-utils \
          || sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libgl1 libxxf86vm1 libxtst6 libfuse2 desktop-file-utils

      - name: Install WiX CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version "7.*"

      - name: Resolve dependencies and fetch pinned rclone and restic
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon testClasses :bitferry-app:fetchTools; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Gradle fetch failed (attempt $attempt); retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Expose fetched engines on PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tools_dir="${RUNNER_TEMP}/bitferry-tools"
          mkdir -p "$tools_dir"
          ln -sf "${GITHUB_WORKSPACE}/bitferry-app/build/image/bitferry-${{ matrix.target }}/bin/rclone" "$tools_dir/rclone"
          ln -sf "${GITHUB_WORKSPACE}/bitferry-app/build/image/bitferry-${{ matrix.target }}/bin/restic" "$tools_dir/restic"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Expose fetched engines on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:RUNNER_TEMP "bitferry-tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          $binDir = "${{ github.workspace }}\bitferry-app\build\image\bitferry-${{ matrix.target }}\bin"
          Copy-Item -Force (Join-Path $binDir "rclone.exe"), (Join-Path $binDir "restic.exe") $toolsDir
          Add-Content -Path $env:GITHUB_PATH -Value $toolsDir

      - name: Verify fetched tools
        run: |
          rclone version
          restic version

      - name: Run checks and build distribution (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run -a ./gradlew --no-daemon check :bitferry-app:dist

      - name: Run checks and build distribution (Windows/macOS)
        if: runner.os != 'Linux'
        run: ./gradlew --no-daemon check :bitferry-app:dist

      - name: Smoke-test Windows app-image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "./bitferry-app/src/packaging/verifyWindowsImage.ps1" `
            -ImageDir "./bitferry-app/build/jpackage/bitferry"

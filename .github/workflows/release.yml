name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric release version (X.Y.Z, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine and validate version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="${{ inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$ver'. Expected X.Y.Z (required by WiX MSI)." >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $ver"

  package:
    name: Package (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            upload_bundle: true
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            upload_bundle: false
          - target: windows-x64
            os: windows-latest
            upload_bundle: false
          - target: macos-aarch64
            os: macos-latest
            upload_bundle: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux Xvfb and JavaFX system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libgl1 libglx-mesa0 libxxf86vm1 libxtst6 libfuse2t64 desktop-file-utils \
          || sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libgl1 libxxf86vm1 libxtst6 libfuse2 desktop-file-utils

      - name: Install WiX CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version "7.*"

      - name: Fetch pinned rclone and restic for tests
        run: ./gradlew --no-daemon :bitferry-app:fetchTools

      - name: Add fetched engines to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/bitferry-app/build/image/bitferry-${{ matrix.target }}/bin" >> "$GITHUB_PATH"

      - name: Add fetched engines to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\bitferry-app\build\image\bitferry-${{ matrix.target }}\bin"

      - name: Run checks and build native packages (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          xvfb-run -a ./gradlew --no-daemon \
            -Pversion=${{ needs.prepare.outputs.version }} \
            check :bitferry-app:dist

      - name: Run checks and build native packages (macOS)
        if: runner.os == 'macOS'
        run: |
          ./gradlew --no-daemon \
            -Pversion=${{ needs.prepare.outputs.version }} \
            check :bitferry-app:dist

      - name: Run checks and build native packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew --no-daemon `
            -Pversion=${{ needs.prepare.outputs.version }} `
            check :bitferry-app:dist

      - name: Stage release assets
        shell: bash
        run: |
          ver="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          mkdir -p release-assets
          shopt -s nullglob
          for f in "bitferry-app/build/installer/bitferry-${ver}-${target}."*; do
            cp -f "$f" release-assets/
          done
          if [ "${{ matrix.upload_bundle }}" = "true" ]; then
            for f in \
              "bitferry-app/build/distributions/bitferry-${ver}.zip" \
              "bitferry-app/build/distributions/bitferry-${ver}.tar.gz"; do
              cp -f "$f" release-assets/
            done
          fi
          ls -la release-assets

      - name: Upload target release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Bitferry v${{ needs.prepare.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Upload consolidated dry-run bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bitferry-v${{ needs.prepare.outputs.version }}-all
          path: dist/*
          if-no-files-found: error

// Distribution project: assembles a single platform-specific runtime tree from the
// bitferry.cli and bitferry.gui modules, trains the JDK 25 AOT caches inside that
// tree and (on the build host platform) wraps it into a jpackage app-image with
// native launchers.
//
//   ./gradlew :bitferry-app:jlink                      # plain jlink tree (works cross-platform)
//   ./gradlew :bitferry-app:bundle                     # + distro jar archive, zip + tar.gz (target-independent)
//   ./gradlew :bitferry-app:jpackageImage              # + jpackage app-image with native launchers (host platform only)
//   ./gradlew :bitferry-app:msi                        # + per-user Windows MSI (WiX; Windows host only)
//   ./gradlew :bitferry-app:appimage                   # + single-file Linux AppImage (Linux host only)
//   ./gradlew :bitferry-app:dist                       # everything applicable for the current -Ptarget
//   ./gradlew :bitferry-app:dist -Ptarget=windows-x64  # cross-build a windows-x64 jlink tree

plugins {
    id 'application'
    id 'org.beryx.jlink' version '4.2.0'
}

import org.gradle.internal.os.OperatingSystem

// NOTE: no application.mainClass here — javac would embed a ModuleMainClass attribute for
// bitferry.gui.BitferryGui into this (aggregate) module, producing an invalid descriptor.
// The launch roots are declared in the jlink block below.

dependencies {
    implementation project(':bitferry-cli')
    implementation project(':bitferry-gui')
}

// ---------------------------------------------------------------- target selection

def targetProperty = providers.gradleProperty('target').getOrElse('native')
def knownTargets = ['native', 'windows-x64', 'linux-x64', 'linux-aarch64', 'macos-x64', 'macos-aarch64']
if (!(targetProperty in knownTargets)) {
    throw new GradleException("Unknown -Ptarget '$targetProperty' (expected: ${knownTargets.join(', ')})")
}

def cross = targetProperty != 'native'

def hostSuffix = OperatingSystem.current().windows ? 'windows-x64'
        : OperatingSystem.current().macOsX
        ? (System.getProperty('os.arch') == 'aarch64' ? 'macos-aarch64' : 'macos-x64')
        : (System.getProperty('os.arch') == 'aarch64' ? 'linux-aarch64' : 'linux-x64')

def platformName = cross ? targetProperty : hostSuffix

// Every windows-* target shares the jpackage launcher layout, launcher subsystem and
// executable naming, regardless of architecture.
def windowsTarget = platformName.startsWith('windows')

// Zulu build pinned as the source of jmods for cross-targets; its embedded java version
// must match the toolchain major version (gradle.properties: bitferry.java). The exact
// update build of the auto-provisioned toolchain itself is whatever matching Zulu 25 the
// foojay resolver returns.
def zuluArtifact = 'zulu25.38.107-ca-jdk25.0.5'
def toolchainMajor = providers.gradleProperty('bitferry.java').getOrElse('25')
if (!zuluArtifact.contains("jdk${toolchainMajor}.")) {
    throw new GradleException("Zulu artifact '$zuluArtifact' does not match the toolchain " +
            "major version $toolchainMajor (gradle.properties: bitferry.java)")
}
def zuluJdkUrl = [
        'windows-x64'   : "https://cdn.azul.com/zulu/bin/${zuluArtifact}-win_x64.zip",
        'linux-x64'     : "https://cdn.azul.com/zulu/bin/${zuluArtifact}-linux_x64.tar.gz",
        'linux-aarch64' : "https://cdn.azul.com/zulu/bin/${zuluArtifact}-linux_aarch64.tar.gz",
        'macos-x64'     : "https://cdn.azul.com/zulu/bin/${zuluArtifact}-macosx_x64.zip",
        'macos-aarch64' : "https://cdn.azul.com/zulu/bin/${zuluArtifact}-macosx_aarch64.zip",
][platformName]
// e.g. zulu25.38.107-ca-jdk25.0.5-win_x64 - unique per version and platform
def zuluDistName = zuluJdkUrl.substring(zuluJdkUrl.lastIndexOf('/') + 1).replaceAll(/\.(zip|tar\.gz)$/, '')

// AOT caches can only be trained by executing the image JVM, which is possible
// solely when the target platform matches the build host.
def trainable = !cross

// ---------------------------------------------------------------- image locations

def imageBaseDir = layout.buildDirectory.dir('image')
// Both layouts land at the same path: for native targets the plugin generates the image
// in <imageDir> directly, for cross targets it appends "-<platformName>" to it.
def runtimeImageDir = imageBaseDir.get().dir("bitferry-${platformName}").asFile

def javaBin = new File(runtimeImageDir, OperatingSystem.current().windows ? 'bin/java.exe' : 'bin/java')
def aotDir = new File(runtimeImageDir, 'lib/aot')

def jpackageImageDir = layout.buildDirectory.dir('jpackage').get().dir('bitferry').asFile

// ---------------------------------------------------------------- jlink / jpackage

// The native-access whitelists shared verbatim by the launchers and the AOT training
// tasks: the AOT system records the enable-native-access set in the cache and
// invalidates it on any drift between the training and the runtime flags, so the two
// sides must never diverge (both are wired to the same variables below, and the
// training tasks track the values as their inputs).
def cliNativeAccess = 'org.fusesource.jansi,com.sun.jna'
def guiNativeAccess = 'javafx.graphics,org.fusesource.jansi,com.sun.jna'

jlink {
    imageDir = cross ? imageBaseDir.get().asFile : runtimeImageDir

    // The primary launch root doubles as the jpackage main launcher: naming it 'bitferry'
    // — like the app image — makes the jpackage main launcher and the CLI launcher the same
    // (jpackage forbids an --add-launcher sharing the main image name).
    moduleName = 'org.bitferry.cli'
    mainClass = 'org.bitferry.cli.Main'

    options = ['--compress', 'zip-6', '--strip-debug', '--no-header-files', '--no-man-pages']

    // Packaged deployments always drive the engines they were built with: every launcher
    // points the core at the bundled executables via the bitferry.rclone / bitferry.restic
    // system properties, which bitferry.task.ExecutorSupport prioritizes over the
    // RCLONE/RESTIC environment variables (the resolution order is property -> environment
    // -> bundled -> PATH). jpackage launchers cannot define environment variables — the cfg
    // format only knows app.mainmodule, app.mainjar, app.mainclass, app.classpath,
    // arguments and java-options — so the packaged locations travel as system properties,
    // expanded by the launcher binary itself and therefore intact under AppImage/Flatpak/
    // Snap wrappers on Linux. {{BIN_DIR}} resolves to the image bin dir in jlink start
    // scripts and to $APPDIR/.. in jpackage launcher configs — in both cases the tools
    // land at <image>/bin, next to the launchers.
    def bundledToolExeSuffix = windowsTarget ? '.exe' : ''
    def bundledToolProps = ["-Dbitferry.rclone={{BIN_DIR}}/../bin/rclone${bundledToolExeSuffix}",
                            "-Dbitferry.restic={{BIN_DIR}}/../bin/restic${bundledToolExeSuffix}"]

    launcher {
        name = 'bitferry'
        // {{BIN_DIR}} resolves to the image bin dir in jlink start scripts and
        // to $APPDIR/.. in jpackage launcher configs.
        // --enable-native-access: the jansi console and the JNA dispatch native load
        // via System::load (a restricted method) - required since the strong encapsulation
        jvmArgs = ["-XX:AOTCache={{BIN_DIR}}/../lib/aot/cli.aot",
                   "--enable-native-access=" + cliNativeAccess,
                   "-Djna.boot.library.path={{BIN_DIR}}/../lib"] + bundledToolProps
        unixScriptTemplate = file('src/packaging/unixStartScript.txt')
    }
    secondaryLauncher {
        name = 'bitferry-gui'   // only the GUI launcher is suffixed
        moduleName = 'org.bitferry.gui'
        mainClass = 'org.bitferry.gui.Main'
        jvmArgs = ["-XX:AOTCache={{BIN_DIR}}/../lib/aot/gui.aot",
                   "--enable-native-access=" + guiNativeAccess,
                   "-Djna.boot.library.path={{BIN_DIR}}/../lib"] + bundledToolProps
        unixScriptTemplate = file('src/packaging/unixStartScript.txt')
        // A top-level --win-console is inherited by --add-launcher launchers unless overridden;
        // this keeps the GUI launcher a GUI-subsystem executable on Windows. jpackage ignores
        // the win-console property on other platforms.
        winConsole = false
    }

    if (cross) {
        targetPlatform(platformName) {
            jdkHome = jdkDownload(zuluJdkUrl) {
                // Shared across checkouts, outside the project tree; keyed by the
                // Zulu artifact so version bumps re-download instead of reusing stale bits.
                downloadDir = new File(gradle.gradleUserHomeDir, "jdks/bitferry/${zuluDistName}").absolutePath
            }
        }
    }

    jpackage {
        imageName = 'bitferry'
        skipInstaller = true        // file trees only - no platform packages/archives
        vendor = 'Bitferry'
        // jpackage must run on the target platform, so it is only wired up for native builds.
        // Without --win-console the main launcher is a GUI-subsystem executable and the CLI
        // produces no console output on Windows. The option is Windows-only jpackage syntax,
        // and since jpackageImage only runs for the host platform, the target check suffices.
        if (windowsTarget) {
            imageOptions = ['--win-console']
        }
    }
}

// No archives of the image tree, please.
tasks.named('jlinkZip') { enabled = false }
tasks.named('distZip') { enabled = false }
tasks.named('distTar') { enabled = false }

// jpackage is restricted to native builds (it must execute target-platform binaries
// to copy the runtime and produce launchers).
tasks.named('jpackageImage') {
    onlyIf { !cross }
    // The plugin maps {{BIN_DIR}} to "$APPDIR\.." in jpackage launcher configs, where $APPDIR
    // is the dir holding the .cfg (<image>/app on Windows). The {{BIN_DIR}}/.. launcher args
    // (AOT cache, bundled rclone/restic properties) therefore resolve one level above the app
    // image and miss their in-image targets. Rewrite the generated Windows configs to point
    // inside the image; the Linux layout (<image>/lib/app) already resolves correctly.
    if (OperatingSystem.current().windows) {
        doLast {
            def cfgDir = new File(jpackageImageDir, 'app')
            cfgDir.listFiles()?.findAll { it.name.endsWith('.cfg') }?.each { cfg ->
                cfg.text = cfg.text
                        // top-level --java-options (main launcher): the backslash survives
                        .replace('$APPDIR\\..', '$APPDIR')
                        // add-launcher java-options (GUI launcher): the properties parsing
                        // of the launcher prop file drops the backslash
                        .replace('$APPDIR..', '$APPDIR')
            }
        }
    }
}
tasks.named('jpackage') {
    onlyIf { !cross }
}

// Unpack the platform JNA core native into the image trees. JNA's loader consults
// jna.boot.library.path (wired to <image>/lib in the launcher options, the same
// {{BIN_DIR}}/../lib shape as the AOT cache arg) before falling back to the temp-dir
// extraction, so with libjnidispatch loose in the image the extraction never fires:
// the noexec-tempdir hazard disappears and the per-launch unpack/verify overhead
// goes away. JNA is on the hot paths now: the Windows drive-type probing touches it
// on every volume restore (every launch), and the OS keyring access everywhere else.
// Each image carries only its own platform's native - the table maps the build
// targets to the jna jar layout.
def jnaNatives = [
    'windows-x64'   : [jar: 'com/sun/jna/win32-x86-64/jnidispatch.dll',        native: 'jnidispatch.dll'],
    'linux-x64'     : [jar: 'com/sun/jna/linux-x86-64/libjnidispatch.so',      native: 'libjnidispatch.so'],
    'linux-aarch64' : [jar: 'com/sun/jna/linux-aarch64/libjnidispatch.so',     native: 'libjnidispatch.so'],
    'macos-x64'     : [jar: 'com/sun/jna/darwin-x86-64/libjnidispatch.jnilib', native: 'libjnidispatch.jnilib'],
    'macos-aarch64' : [jar: 'com/sun/jna/darwin-aarch64/libjnidispatch.jnilib', native: 'libjnidispatch.jnilib'],
]

tasks.register('copyJnaNative') {
    group = 'bitferry'
    description = "Unpacks the platform JNA native (${jnaNatives[platformName].jar}) into the image trees."
    dependsOn tasks.named('jlink')
    if (!cross) {
        dependsOn tasks.named('jpackageImage')
    }
    doLast {
        def jnaJar = configurations.runtimeClasspath.files.find { it.name ==~ /jna-\d.*/ }
        if (jnaJar == null) {
            throw new GradleException('the jna jar was not found on the runtime classpath')
        }
        def spec = jnaNatives[platformName]
        // Both image flavors take the native into <image>/lib - the dir the launcher
        // boot-path property resolves to (the jpackage layout quirk, if any, mirrors
        // the AOT cache placement in lib/aot)
        def targets = [new File(runtimeImageDir, 'lib/' + spec.native),
                       new File(jpackageImageDir, 'lib/' + spec.native)]
        new java.util.jar.JarFile(jnaJar).withCloseable { jar ->
            def entry = jar.getJarEntry(spec.jar)
            if (entry == null) {
                throw new GradleException("jna native '${spec.jar}' not found in '${jnaJar.name}'")
            }
            for (File target : targets) {
                target.parentFile.mkdirs()
                java.nio.file.Files.copy(jar.getInputStream(entry), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}


// ---------------------------------------------------------------- AOT training
//
// Training runs the image's own java with -XX:AOTCacheOutput, exercising each
// frontend so the cache covers its startup classes. The cache lands in
// <image>/lib/aot and the launchers reference it via -XX:AOTCache.

// ---------------------------------------------------------------- bundled backup engines
//
// The bitferry frontends drive the rclone and restic executables, so both ship inside the
// image: they are downloaded for the target platform, verified against the pinned SHA-256
// checksums below (cross-checked against the official SHA256SUMS when this list was written)
// and placed into <image>/bin as plain executables. Bumping a toolVersions entry changes the
// archive URLs and therefore the download cache keys, so new versions re-download naturally.

def toolVersions = [rclone: '1.76.0', restic: '0.19.1']

// platformName -> tool -> [archive URL, pinned SHA-256, entry path in archive, target name, format]
def toolSpecs = [
    'windows-x64': [
        rclone: ["https://downloads.rclone.org/v${toolVersions.rclone}/rclone-v${toolVersions.rclone}-windows-amd64.zip",
                 '8b4fd2737ade4e70c057ef4a49deb7cffe94b0fb9d7587c189d149823f21a1dc',
                 "rclone-v${toolVersions.rclone}-windows-amd64/rclone.exe", 'rclone.exe', 'zip'],
        restic: ["https://github.com/restic/restic/releases/download/v${toolVersions.restic}/restic_${toolVersions.restic}_windows_amd64.zip",
                 'da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d',
                 "restic_${toolVersions.restic}_windows_amd64.exe", 'restic.exe', 'zip'],
    ],
    'linux-x64': [
        rclone: ["https://downloads.rclone.org/v${toolVersions.rclone}/rclone-v${toolVersions.rclone}-linux-amd64.zip",
                 'b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7',
                 "rclone-v${toolVersions.rclone}-linux-amd64/rclone", 'rclone', 'zip'],
        restic: ["https://github.com/restic/restic/releases/download/v${toolVersions.restic}/restic_${toolVersions.restic}_linux_amd64.bz2",
                 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c',
                 'restic', 'restic', 'bz2'],
    ],
    'linux-aarch64': [
        rclone: ["https://downloads.rclone.org/v${toolVersions.rclone}/rclone-v${toolVersions.rclone}-linux-arm64.zip",
                 'ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78',
                 "rclone-v${toolVersions.rclone}-linux-arm64/rclone", 'rclone', 'zip'],
        restic: ["https://github.com/restic/restic/releases/download/v${toolVersions.restic}/restic_${toolVersions.restic}_linux_arm64.bz2",
                 'a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465',
                 'restic', 'restic', 'bz2'],
    ],
    'macos-x64': [
        rclone: ["https://downloads.rclone.org/v${toolVersions.rclone}/rclone-v${toolVersions.rclone}-osx-amd64.zip",
                 '4f5835733d52b818340f97b1fc0348a70461534d123363a183ca2b660219595a',
                 "rclone-v${toolVersions.rclone}-osx-amd64/rclone", 'rclone', 'zip'],
        restic: ["https://github.com/restic/restic/releases/download/v${toolVersions.restic}/restic_${toolVersions.restic}_darwin_amd64.bz2",
                 'c38d579622cf602f665234c5a8c315030b6cf70656028fe6dc29a786b60e5f35',
                 'restic', 'restic', 'bz2'],
    ],
    'macos-aarch64': [
        rclone: ["https://downloads.rclone.org/v${toolVersions.rclone}/rclone-v${toolVersions.rclone}-osx-arm64.zip",
                 'e72dc90b70f4947a7b72b61bde4a4fbba5777b2874fb448951ffdde67ebd0ab7',
                 "rclone-v${toolVersions.rclone}-osx-arm64/rclone", 'rclone', 'zip'],
        restic: ["https://github.com/restic/restic/releases/download/v${toolVersions.restic}/restic_${toolVersions.restic}_darwin_arm64.bz2",
                 '7be0a144ccc377880f294204aa271d76e4b79554b42a751151d425ce6ebac143',
                 'restic', 'restic', 'bz2'],
    ],
]
if (!(platformName in toolSpecs.keySet())) {
    throw new GradleException("No pinned rclone/restic artifacts for target '$platformName' (expected: ${toolSpecs.keySet().sort().join(', ')})")
}

static String sha256Hex(File file) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        def buf = new byte[64 * 1024]
        int n
        while ((n = stream.read(buf)) != -1) {
            digest.update(buf, 0, n)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

// Downloads the file unless it is already cached, then verifies it against the pinned
// SHA-256 — even on a cache hit, so a corrupted or silently replaced archive fails loudly.
def downloadPinned = { String label, String url, String pinnedSha256, File archive ->
    if (!archive.isFile()) {
        archive.parentFile.mkdirs()
        logger.lifecycle("Downloading $label from $url")
        def result = providers.exec {
            commandLine 'curl', '-fsSL', '--retry', '3', '--connect-timeout', '30',
                        '-o', archive.absolutePath, url
            ignoreExitValue = true
        }.result.get()
        if (result.exitValue != 0) {
            archive.delete()   // no half-downloaded file in the cache
            throw new GradleException("Failed to download $url (curl exit ${result.exitValue})")
        }
    }
    def actualSha256 = sha256Hex(archive)
    if (actualSha256 != pinnedSha256) {
        archive.delete()
        throw new GradleException("SHA-256 mismatch for $label (${archive.name}): " +
                "expected $pinnedSha256, got $actualSha256 (archive deleted; rerun to re-download)")
    }
}

def toolsBinDir = new File(runtimeImageDir, 'bin')

tasks.register('fetchTools') {
    group = 'bitferry'
    description = "Downloads, verifies and installs the pinned rclone/restic executables for ${platformName} into the image bin dir."
    dependsOn tasks.named('jlink')
    outputs.files toolSpecs[platformName].values().collect { new File(toolsBinDir, it[3]) }
    doLast {
        def cacheDir = new File(gradle.gradleUserHomeDir,
                "jdks/bitferry/tools/${toolVersions.rclone}-${toolVersions.restic}")
        toolSpecs[platformName].each { tool, spec ->
            def (url, pinnedSha256, entryPath, targetName, format) = spec
            def archive = new File(cacheDir, url.substring(url.lastIndexOf('/') + 1))
            downloadPinned("$tool for ${platformName}", url, pinnedSha256, archive)
            def extractDir = new File(temporaryDir, tool)
            extractDir.mkdirs()
            def unpacked = format == 'zip'
                    ? new File(extractDir, entryPath)
                    : new File(extractDir, 'unpacked')
            if (format == 'zip') {
                ant.unzip(src: archive, dest: extractDir)
            } else {
                ant.bunzip2(src: archive, dest: unpacked)
            }
            if (!unpacked.isFile()) {
                throw new GradleException("The $tool archive does not contain the expected entry '$entryPath'")
            }
            def target = new File(toolsBinDir, targetName)
            target.parentFile.mkdirs()
            java.nio.file.Files.copy(unpacked.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (!windowsTarget) {
                ant.chmod(file: target, perm: '755')
            }
            logger.lifecycle("Placed $tool ${toolVersions[tool]} into ${target}")
        }
    }
}

// jpackage wraps the runtime image into <image>/runtime (or lib/runtime), which would bury
// the tools and duplicate them. Mirror them to the app-image bin dir instead — next to the
// native launchers — and drop the copy jpackage made inside the packaged runtime.
tasks.register('copyToolsToJpackageImage') {
    group = 'bitferry'
    description = 'Places the bundled rclone/restic executables into the jpackage app-image bin dir.'
    dependsOn tasks.named('jpackageImage'), tasks.named('fetchTools')
    onlyIf { trainable }
    def appImageToolsBinDir = new File(jpackageImageDir, 'bin')
    def packagedRuntimeBinDir = new File(jpackageImageDir,
            windowsTarget ? 'runtime/bin' : 'lib/runtime/bin')
    doLast {
        toolSpecs[platformName].values().each { spec ->
            def targetName = spec[3]
            def src = new File(toolsBinDir, targetName)
            def dst = new File(appImageToolsBinDir, targetName)
            dst.parentFile.mkdirs()
            java.nio.file.Files.copy(src.toPath(), dst.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (!windowsTarget) {
                ant.chmod(file: dst, perm: '755')
            }
            new File(packagedRuntimeBinDir, targetName).delete()
        }
    }
}

// Unpack the platform jansi native into the image trees. jansi's loader probes the
// library path (java.home/lib on unix, java.home\bin on windows) before falling back
// to the temp-dir extraction, so with the native loose in the image the extraction
// never fires: the noexec-tempdir hazard disappears and the unicode output keeps
// rendering on the legacy code page consoles. Each image carries only its own
// platform's native - the table maps the build targets to the jansi jar layout.
def jansiNatives = [
    'windows-x64'   : [jarEntry: 'Windows/x86_64/jansi.dll',   tree: 'bin',                   jpackage: 'runtime/bin'],
    'linux-x64'     : [jarEntry: 'Linux/x86_64/libjansi.so',   tree: 'lib',                   jpackage: 'lib/runtime/lib'],
    'linux-aarch64' : [jarEntry: 'Linux/aarch64/libjansi.so',  tree: 'lib',                   jpackage: 'lib/runtime/lib'],
    'macos-x64'     : [jarEntry: 'Mac/x86_64/libjansi.jnilib', tree: 'lib',                   jpackage: 'lib/runtime/lib'],
    'macos-aarch64' : [jarEntry: 'Mac/aarch64/libjansi.jnilib', tree: 'lib',                  jpackage: 'lib/runtime/lib'],
]

tasks.register('copyJansiNative') {
    group = 'bitferry'
    description = "Unpacks the platform jansi native (${jansiNatives[platformName].jarEntry}) into the image trees."
    dependsOn tasks.named('jlink')
    if (!cross) {
        dependsOn tasks.named('jpackageImage')
    }
    doLast {
        def jansiJar = configurations.runtimeClasspath.files.find { it.name.startsWith('jansi-') }
        if (jansiJar == null) {
            throw new GradleException('the jansi jar was not found on the runtime classpath')
        }
        def spec = jansiNatives[platformName]
        def nativeName = spec.jarEntry.substring(spec.jarEntry.lastIndexOf('/') + 1)
        def targets = [new File(runtimeImageDir, spec.tree + '/' + nativeName),
                       new File(jpackageImageDir, spec.jpackage + '/' + nativeName)]
        new java.util.jar.JarFile(jansiJar).withCloseable { jar ->
            def entry = jar.getJarEntry('org/fusesource/jansi/internal/native/' + spec.jarEntry)
            if (entry == null) {
                throw new GradleException("jansi native '${spec.jarEntry}' not found in '${jansiJar.name}'")
            }
            for (File target : targets) {
                target.parentFile.mkdirs()
                java.nio.file.Files.copy(jar.getInputStream(entry), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}


def cliAotCache = new File(aotDir, 'cli.aot')
def guiAotCache = new File(aotDir, 'gui.aot')

tasks.register('trainCliAot', Exec) {
    group = 'bitferry'
    description = 'Trains the AOT cache for bitferry-cli inside the runtime image.'
    dependsOn tasks.named('jlink')
    onlyIf { trainable }
    outputs.file cliAotCache
    // Retrain when the image is relinked; without this a stale cache survives a relink.
    inputs.file new File(runtimeImageDir, 'lib/modules')
    // Retrain when the launcher whitelist changes: the AOT system invalidates the
    // cache on the enable-native-access drift, and without this tracking the stale
    // (mismatched) cache would silently survive the build
    inputs.property('nativeAccess', cliNativeAccess)
    doFirst { aotDir.mkdirs() }
    commandLine javaBin.absolutePath,
            '-XX:AOTCacheOutput=' + cliAotCache.absolutePath,
            // Must match the launcher's runtime flags exactly (the shared
            // cliNativeAccess variable): the AOT system invalidates the cache when
            // the module graph configuration differs
            '--enable-native-access=' + cliNativeAccess,
            '-m', 'org.bitferry.cli/org.bitferry.cli.Main',
            'info'
}

// GUI training opens a window briefly. Monocle is not part of the OpenJFX Maven artifacts,
// so on headless builds the training run is allowed to fail at toolkit init - the AOT cache
// is still written and covers JVM/module/JavaFX startup classes (use xvfb-run for full coverage).
def guiHeadlessMode = providers.gradleProperty('aotGuiHeadless').getOrElse('auto') // auto|force|never
def hasDisplay = OperatingSystem.current().windows || OperatingSystem.current().macOsX || System.getenv('DISPLAY') != null || System.getenv('WAYLAND_DISPLAY') != null
def guiHeadless = guiHeadlessMode == 'force' || (guiHeadlessMode == 'auto' && !hasDisplay)

tasks.register('trainGuiAot', Exec) {
    group = 'bitferry'
    description = 'Trains the AOT cache for bitferry-gui inside the runtime image (opens a window briefly).'
    dependsOn tasks.named('jlink')
    onlyIf { trainable }
    outputs.file guiAotCache
    // Retrain when the image is relinked; without this a stale cache survives a relink.
    inputs.file new File(runtimeImageDir, 'lib/modules')
    inputs.property('nativeAccess', guiNativeAccess)
    ignoreExitValue = guiHeadless
    doFirst { aotDir.mkdirs() }
    def cmd = [javaBin.absolutePath,
               '-XX:AOTCacheOutput=' + guiAotCache.absolutePath,
               '--enable-native-access=' + guiNativeAccess]
    cmd += ['-m', 'org.bitferry.gui/org.bitferry.gui.Main', '--train']
    commandLine cmd
    if (guiHeadless) {
        doLast {
            logger.warn('bitferry-gui AOT training ran without a display: the toolkit init fails, '
                    + 'so the cache covers startup classes only. Run under a display (or xvfb-run) for full coverage.')
        }
    }
}

// The caches and the bundled rclone/restic executables must exist before jpackage copies
// the runtime image into the app-image; jpackage's $APPDIR-relative lookup expects the
// caches next to the app lib dir.
tasks.named('jpackageImage') {
    dependsOn 'trainCliAot', 'trainGuiAot', 'fetchTools'
}

tasks.register('copyAotCachesToJpackageImage', Copy) {
    group = 'bitferry'
    description = 'Mirrors the trained AOT caches to the jpackage app-image lib dir.'
    dependsOn tasks.named('jpackageImage'), 'copyToolsToJpackageImage'
    onlyIf { trainable }
    from aotDir
    into new File(jpackageImageDir, 'lib/aot')
}

// ---------------------------------------------------------------- Windows installer (WiX)
//
// Packages the jpackage app-image into a per-user MSI (installs to
// %LOCALAPPDATA%\Programs\Bitferry, user PATH included). WiX drives the harvest via
// <Files> wildcards, so no generated fragment is needed. Requires the wix tool on PATH
// (dotnet tool install --global wix) and only ever runs for the native Windows host.

def wixSourceDir = file('src/packaging/wix')
def msiFile = layout.buildDirectory.dir('installer')
        .get().file("bitferry-${project.version}-${platformName}.msi").asFile

tasks.register('msi', Exec) {
    group = 'bitferry'
    description = 'Builds the per-user Windows MSI installer (WiX) from the jpackage app-image.'
    dependsOn 'copyAotCachesToJpackageImage', 'copyJansiNative', 'copyJnaNative'
    onlyIf { !cross && OperatingSystem.current().windows }
    inputs.dir jpackageImageDir
    inputs.dir wixSourceDir
    outputs.file msiFile
    doFirst {
        msiFile.parentFile.mkdirs()
        try {
            providers.exec { commandLine 'wix', '--version' }.standardOutput.asText.get()
        } catch (Exception e) {
            throw new GradleException("The 'wix' tool is not available on PATH. " +
                    'Install it with: dotnet tool install --global wix', e)
        }
    }
    commandLine (['wix', 'build',
                  '-arch', 'x64',
                  '-acceptEula', 'wix7',
                  '-d', "imageDir=${jpackageImageDir.absolutePath}",
                  '-d', "productVersion=${project.version}",
                  '-o', msiFile.absolutePath] +
            wixSourceDir.listFiles().findAll { it.name.endsWith('.wxs') }*.absolutePath)
}

// ---------------------------------------------------------------- Linux AppImage
//
// Packages the jpackage app-image into a single-file type-2 AppImage with appimagetool -
// the Linux counterpart of the MSI above: native Linux host only, wrapping the finished
// app-image, with the packing tool and its squashfs runtime downloaded and SHA-256-pinned
// like the backup engines. The tool is executed through --appimage-extract-and-run, so
// building needs no FUSE. --runtime-file pins the embedded squashfs runtime; without it
// appimagetool downloads the latest runtime unpinned at build time.

def appImageToolVersion = '1.9.1'
def appImageRuntimeTag = '20251108'

// AppImage architecture of the native build host. Hashes are the GitHub-published sha256
// digests of the release assets, cross-checked locally at pin time; bump version/tag and
// hashes together.
def appImageArch = System.getProperty('os.arch') == 'aarch64' ? 'aarch64' : 'x86_64'
def appImageToolSpecs = [
    x86_64: [
        tool   : ["https://github.com/AppImage/appimagetool/releases/download/${appImageToolVersion}/appimagetool-x86_64.AppImage",
                  'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'],
        runtime: ["https://github.com/AppImage/type2-runtime/releases/download/${appImageRuntimeTag}/runtime-x86_64",
                  '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'],
    ],
    aarch64: [
        tool   : ["https://github.com/AppImage/appimagetool/releases/download/${appImageToolVersion}/appimagetool-aarch64.AppImage",
                  'f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158'],
        runtime: ["https://github.com/AppImage/type2-runtime/releases/download/${appImageRuntimeTag}/runtime-aarch64",
                  '00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444'],
    ],
]

def appImageCacheDir = new File(gradle.gradleUserHomeDir,
        "jdks/bitferry/tools/appimagetool/${appImageToolVersion}-${appImageRuntimeTag}")
def appImageToolFile = new File(appImageCacheDir, "appimagetool-${appImageArch}.AppImage")
def appImageRuntimeFile = new File(appImageCacheDir, "runtime-${appImageArch}")

def appImageSourceDir = file('src/packaging/appimage')
def appImageDir = layout.buildDirectory.dir('appimage').get().dir('AppDir').asFile
def appImageFile = layout.buildDirectory.dir('installer')
        .get().file("bitferry-${project.version}-${platformName}.AppImage").asFile

tasks.register('fetchAppImageTool') {
    group = 'bitferry'
    description = "Downloads and verifies the pinned appimagetool ${appImageToolVersion} and squashfs runtime ${appImageRuntimeTag} for ${appImageArch}."
    outputs.files appImageToolFile, appImageRuntimeFile
    doLast {
        appImageToolSpecs[appImageArch].each { kind, spec ->
            def (url, pinnedSha256) = spec
            downloadPinned("appimagetool $kind (${appImageArch})", url, pinnedSha256,
                    kind == 'tool' ? appImageToolFile : appImageRuntimeFile)
        }
        ant.chmod(file: appImageToolFile, perm: '755')
    }
}

tasks.register('prepareAppImageDir', Sync) {
    group = 'bitferry'
    description = 'Assembles the AppImage AppDir (payload, AppRun, desktop entry, icon) from the jpackage app-image.'
    // The natives must land in the jpackage tree before the AppDir sync mirrors it
    dependsOn 'copyAotCachesToJpackageImage', 'copyJansiNative', 'copyJnaNative'
    onlyIf { !cross && OperatingSystem.current().linux }
    // The AppRun/desktop sources and the whole AppDir (including the doLast-written root
    // files) must be tracked, or source edits slip past up-to-date checks.
    inputs.dir appImageSourceDir
    outputs.dir appImageDir
    from jpackageImageDir
    into new File(appImageDir, 'usr/app')
    // jpackage marks runtime legal notices read-only; a re-sync cannot overwrite them in
    // place, so lay the payload down fresh instead.
    doFirst { project.delete(new File(appImageDir, 'usr/app')) }
    doLast {
        // Static AppRun and desktop entry: AppRun dispatches -g/--gui to the GUI launcher
        // and everything else to the CLI; Exec=bitferry --gui makes menu launches (after
        // the desktop-integration rewrite to the AppImage path) open the GUI.
        ['AppRun', 'bitferry.desktop'].each { name ->
            java.nio.file.Files.copy(new File(appImageSourceDir, name).toPath(),
                    new File(appImageDir, name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        ant.chmod(file: new File(appImageDir, 'AppRun'), perm: '755')

        // Version stamp for the desktop entry: consumed by the AppRun install machinery
        // (no version parsing in shell) and shown by desktop integration tools.
        new File(appImageDir, 'bitferry.desktop').withWriterAppend {
            it.writeLine("X-AppImage-Version=${project.version}")
        }

        // Placeholder icon: deterministic and headless-safe (plain AWT buffers, no
        // toolkit). Replace this block with real artwork when it becomes available.
        def size = 256
        def img = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = img.createGraphics()
        try {
            g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                    java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
            g.setColor(new java.awt.Color(0x1f, 0x24, 0x30))   // dark slate
            g.fillRoundRect(8, 8, size - 16, size - 16, 48, 48)
            g.setColor(new java.awt.Color(0xe8, 0xa3, 0x3d))   // amber
            g.setFont(new java.awt.Font(java.awt.Font.SANS_SERIF, java.awt.Font.BOLD, 120))
            def metrics = g.getFontMetrics()
            g.drawString('BF', (size - metrics.stringWidth('BF')) / 2,
                    (size - metrics.height) / 2 + metrics.ascent)
        } finally {
            g.dispose()
        }
        javax.imageio.ImageIO.write(img, 'png', new File(appImageDir, 'bitferry.png'))

        // AppImage convention: a .DirIcon symlink to the icon for thumbnailers/menu entries.
        def dirIcon = new File(appImageDir, '.DirIcon')
        java.nio.file.Files.deleteIfExists(dirIcon.toPath())
        java.nio.file.Files.createSymbolicLink(dirIcon.toPath(),
                java.nio.file.Path.of('bitferry.png'))
    }
}

tasks.register('appimage', Exec) {
    group = 'bitferry'
    description = 'Builds the single-file Linux AppImage from the jpackage app-image.'
    dependsOn 'prepareAppImageDir', 'fetchAppImageTool'
    onlyIf { !cross && OperatingSystem.current().linux }
    inputs.dir appImageSourceDir
    inputs.dir appImageDir
    inputs.files appImageToolFile, appImageRuntimeFile
    outputs.file appImageFile
    doFirst {
        appImageFile.parentFile.mkdirs()
    }
    // appimagetool cannot always detect the payload architecture (mixed scripts and
    // binaries in the AppDir), so state it explicitly for the runtime selection.
    environment 'ARCH', appImageArch
    commandLine appImageToolFile.absolutePath, '--appimage-extract-and-run',
            '--no-appstream',                                   // no AppStream metainfo yet
            '--runtime-file', appImageRuntimeFile.absolutePath,
            appImageDir.absolutePath, appImageFile.absolutePath
}

// ---------------------------------------------------------------- joint jar archives
//
// A platform-neutral zip/tar.gz for distro packaging: the three bitferry module jars plus
// their small jar dependencies (picocli, Jackson) and cross-platform launcher
// scripts. JavaFX is excluded — the packager supplies their own OpenJFX (dropped into
// lib/, which the launchers put on the module path) — as are the JVM and the rclone/restic
// engines (resolved by bitferry.task.ExecutorSupport: the RCLONE/RESTIC environment
// override, then the bare name for the PATH lookup).
// Everything bundled is target-independent, so the archive names carry no platform suffix.

configurations {
    jarBundle {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom configurations.runtimeClasspath
        exclude group: 'org.openjfx'
    }
}

def portableDir = layout.buildDirectory.dir('distributions')
def portableBaseName = "bitferry-${project.version}"
def portableZipFile = portableDir.get().file("${portableBaseName}.zip").asFile
def portableTarFile = portableDir.get().file("${portableBaseName}.tar.gz").asFile

def distScriptDir = file('src/packaging/distScripts')

def portableSpec = copySpec {
    into portableBaseName   // extraction yields bitferry-<version>/{bin,lib}/...
    into 'lib', {
        from configurations.jarBundle
    }
    into 'bin', {
        from distScriptDir
        filePermissions { unix('0755') }   // zip drops source exec bits; force launchers executable
    }
}

[Zip, Tar].each { kind ->
    tasks.register(kind.simpleName.toLowerCase(java.util.Locale.ROOT), kind) {
        // The workers of the bundle task; reachable individually but not advertised
        with portableSpec
        destinationDirectory = portableDir
        archiveFileName = kind == Zip ? "${portableBaseName}.zip" : "${portableBaseName}.tar.gz"
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        if (kind == Tar) {
            compression = 'gzip'
        }
    }
}

// The user-facing entry point producing both archive flavors
tasks.register('bundle') {
    group = 'bitferry'
    description = 'Bundles the platform-neutral jar archive in both flavors (zip + tar.gz; bitferry modules + picocli/Jackson + launchers; JavaFX and engines come from the packager).'
    dependsOn 'zip', 'tar'
}

// ---------------------------------------------------------------- lifecycle

def projectVersion = project.version.toString()

tasks.register('dist') {
    group = 'build'
    def linuxHost = OperatingSystem.current().linux
    description = "Builds the full distribution for target '${platformName}' (jlink tree + portable zip/tar.gz${trainable ? ' + AOT caches + jpackage app-image' : ''}${trainable && OperatingSystem.current().windows ? ' + Windows MSI' : ''}${trainable && linuxHost ? ' + AppImage' : ''})."
    dependsOn 'bundle'
    // The loose natives (jansi console, JNA dispatch) travel with every image flavor;
    // the packaged paths pull them via the msi/AppImage chains, the jlink-tree-only
    // deliveries need them explicitly
    dependsOn 'copyJansiNative', 'copyJnaNative'
    if (trainable) {
        dependsOn 'copyAotCachesToJpackageImage'
        if (OperatingSystem.current().windows) {
            dependsOn 'msi'
        }
        if (linuxHost) {
            dependsOn 'appimage'
        }
    } else {
        dependsOn tasks.named('jlink')
        dependsOn 'fetchTools'
    }
    doLast {
        def deliverables = trainable
                ? ["jlink tree:       $runtimeImageDir", "jpackage app-image: $jpackageImageDir"]
                : ["jlink tree:       $runtimeImageDir (cross-built, no AOT caches — train on the target)"]
        deliverables += "portable archives:  $portableZipFile, $portableTarFile"
        if (trainable && OperatingSystem.current().windows) {
            deliverables += "Windows installer:  $msiFile"
        }
        if (trainable && linuxHost) {
            deliverables += "AppImage:           $appImageFile"
        }
        logger.lifecycle("bitferry ${projectVersion} [${platformName}] deliverables:")
        deliverables.each { logger.lifecycle("  ${it}") }
    }
}

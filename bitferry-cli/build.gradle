plugins {
    id 'java-library'
    id 'application'
}

dependencies {
    // The module descriptor requires both transitively (the CLI API exposes the core
    // types and the picocli machinery), so they travel in the api scope
    api project(':bitferry')
    api libs.picocli

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}

application {
    mainModule = 'bitferry.cli'
    mainClass = 'bitferry.cli.Main'
}

// No plain distribution archives: the real deliverables (jlink tree, jpackage app-image,
// MSI/AppImage) are assembled in :bitferry-app. A bare jars+scripts bundle would omit the
// bundled engines, AOT caches and native launchers and only invite accidental packaging.
tasks.named('distZip') { enabled = false }
tasks.named('distTar') { enabled = false }

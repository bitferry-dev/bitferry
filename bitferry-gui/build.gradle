import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java-library'
    id 'application'
}

// The JavaFX classifier must match the distribution target, which defaults to the build host.
def target = providers.gradleProperty('target').getOrElse('native')

def hostClassifier = OperatingSystem.current().windows ? 'win'
        : OperatingSystem.current().macOsX
        ? (System.getProperty('os.arch') == 'aarch64' ? 'mac-aarch64' : 'mac')
        : (System.getProperty('os.arch') == 'aarch64' ? 'linux-aarch64' : 'linux')

def targetClassifiers = [
        'windows-x64'  : 'win',
        'linux-x64'    : 'linux',
        'linux-aarch64': 'linux-aarch64',
        'macos-x64'    : 'mac',
        'macos-aarch64': 'mac-aarch64',
]

def javafxClassifier = target == 'native' ? hostClassifier : targetClassifiers[target]
if (!javafxClassifier) {
    throw new GradleException("Unknown -Ptarget '$target' (expected native, windows-x64, linux-x64, linux-aarch64, macos-x64, macos-aarch64)")
}

dependencies {
    // The module descriptor requires the core and the JavaFX modules, so they travel
    // in the api scope
    api project(':bitferry')

    // The classifier pulls javafx-base/graphics/controls/fxml natives for the target
    // platform. The no-classifier artifacts are empty stubs, so all modules are
    // declared explicitly.
    def javafxVersion = libs.versions.javafx.get()
    api "org.openjfx:javafx-base:$javafxVersion:$javafxClassifier"
    api "org.openjfx:javafx-graphics:$javafxVersion:$javafxClassifier"
    api "org.openjfx:javafx-controls:$javafxVersion:$javafxClassifier"
    api "org.openjfx:javafx-fxml:$javafxVersion:$javafxClassifier"

    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
}

tasks.named('test') {
    useJUnitPlatform()
}

application {
    mainModule = 'bitferry.gui'
    mainClass = 'bitferry.gui.Main'
    // The JavaFX graphics, the jansi console and the JNA dispatch native load via
    // System::load (a restricted method) - enabled here so the installed distribution
    // stays warning-free and keeps working on the future JDKs with the integrity by
    // default. Mirrors guiNativeAccess in :bitferry-app (the AOT cache records the set
    // and invalidates on drift, so the two sides must never diverge).
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics,org.fusesource.jansi,com.sun.jna']
}

// No plain distribution archives: the real deliverables (jlink tree, jpackage app-image,
// MSI/AppImage) are assembled in :bitferry-app. A bare jars bundle would omit the bundled
// engines, AOT caches and native launchers and only invite accidental packaging.
tasks.named('distZip') { enabled = false }
tasks.named('distTar') { enabled = false }

plugins {
    id 'java-library'
}

dependencies {
    // The (de)serialization machinery of the storage; surfaced in the exported API
    // (the module descriptor requires it transitively), hence api scope
    api libs.jackson.databind
    // The Jackson annotations the model classes are decorated with; the module
    // descriptor requires them, so consumers resolving the module need them too
    api libs.jackson.annotations

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}

// The single source of truth for the version is the Gradle project version (root
// build.gradle); it is baked into the module's resources and read back by bitferry.Bitferry.
processResources {
    inputs.property 'version', project.version.toString()
    filesMatching('bitferry/version.properties') {
        expand 'version': project.version.toString()
    }
}

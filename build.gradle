plugins {
    id 'base'
}

def resolvedVersion = providers.gradleProperty('version').getOrElse('0.1.0')

allprojects {
    group = 'org.bitferry'
    version = resolvedVersion

    repositories {
        // Prefer Google's CDN mirror of Maven Central so concurrent CI runners avoid
        // repo.maven.apache.org HTTP 429 rate limits; fall back to mavenCentral() if absent.
        maven {
            url = uri('https://maven-central.storage-download.googleapis.com/maven2')
        }
        mavenCentral()
    }
}

subprojects {
    plugins.withId('java') {
        java {
            def javaMajor = providers.gradleProperty('bitferry.java')
                    .map { it as int }
                    .orElse(25)
                    .get()

            sourceCompatibility = JavaVersion.toVersion(javaMajor)
            targetCompatibility = JavaVersion.toVersion(javaMajor)

            toolchain {
                languageVersion = JavaLanguageVersion.of(javaMajor)
                // Zulu builds are used for compiling, running, jlink and jpackage
                vendor = JvmVendorSpec.AZUL
            }
        }
    }
}

plugins {
    id 'base'
}

allprojects {
    group = 'io.bitferry'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withId('java') {
        java {
            def javaMajor = providers.gradleProperty('bitferry.java')
                    .map { it as int }
                    .orElse(25)
                    .get()

            sourceCompatibility = JavaVersion.toVersion(javaMajor)
            targetCompatibility = JavaVersion.toVersion(javaMajor)

            toolchain {
                languageVersion = JavaLanguageVersion.of(javaMajor)
                // Zulu builds are used for compiling, running, jlink and jpackage
                vendor = JvmVendorSpec.AZUL
            }
        }
    }
}
